[/Script/Engine.RendererSettings]
; NO HARDWARE RAY TRACING ON THIS MACHINE. Step 0 established that the RX 550
; (Polaris/GCN4) exposes neither VK_KHR_ray_query nor
; VK_KHR_ray_tracing_pipeline -- AMD RT starts at RDNA 2.
;
; UE5 defaults DynamicGlobalIlluminationMethod to Lumen. With no hardware RT
; Lumen falls back to software tracing, which this GPU cannot drive either, and
; the result is a scene that renders BLACK -- which is exactly what the first
; run produced: 23 course meshes built and logged, and nothing visible.
;
; So GI and reflections are switched off explicitly. Direct lighting from a
; movable directional light is all this needs; the mirrors do their own exact
; planar reflection through a SceneCapture and never wanted screen-space or
; ray-traced reflections anyway.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
r.DefaultFeature.AutoExposure=False
r.AllowStaticLighting=False

; THE FRAME BUDGET (task 18). Measured with `cockpit/run.sh profile`: the frame
; is GPU-bound -- GPU 24.0 ms of a 25.7 ms frame; render thread 6, game 1.8.
; Of one profiled frame's 19.8 ms of GPU work (ProfileGPU):
;   10.9 ms  TSR, UE5's default anti-aliasing, at Epic: a 2560x1440 history for
;            a 1280x720 view -- more than the whole rest of the frame. TAA
;            instead (2); it has no upscaling and nothing here needs any.
;    1.5 ms  the translucency lighting volume: 0.79 in the view and 0.75 in
;            each mirror capture. It lights TRANSLUCENT materials and there are
;            none: BasicShapeMaterial and the unlit M_Mirror are both opaque.
;    0.8 ms  motion blur, which a driving test does not want either: it smears
;            the mirrors and the lines the driver is judged against.
r.AntiAliasingMethod=2
r.TranslucencyLightingVolume=0
r.DefaultFeature.MotionBlur=False

[/Script/EngineSettings.GameMapsSettings]
; No authored level exists yet -- SimA/Content is empty. /Engine/Maps/Entry is
; the engine's minimal map and contributes nothing but somewhere to stand;
; AChronoGameMode spawns the course, the car and the lighting into it from
; course/*.txt. scripts/20-make-level.py bakes that into /Game/Maps/SimACourse
; for editor refinement, after which these two lines should point at it.
EditorStartupMap=/Game/Maps/SimACourse.SimACourse
GameDefaultMap=/Game/Maps/SimACourse.SimACourse
GlobalDefaultGameMode=/Script/ChronoBridge.ChronoGameMode

